name: Restorey
options:
  bundleIdPrefix: com.jaydenkerr
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  # Icon Composer's AppIcon.icon is a package (icon.json + Assets/): treat it as one file, or XcodeGen adds its
  # insides as loose resources and actool never sees the icon (xcodegen-gotchas; XcodeGen issue #1556).
  fileTypes:
    icon:
      file: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.4"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  RestoreyCore:
    path: RestoreyCore
targets:
  RestoreyAgent:
    type: application
    platform: macOS
    sources:
      - Agent
      # The agent posts the notifications, which show its bundle's icon, so it carries the app icon too.
      - path: Resources/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: RestoreyCore
        product: RestoreyCore
      - package: RestoreyCore
        product: AgentCore
      # The Wi-Fi name for the "skip on these Wi-Fi networks" rule, and the Location permission it needs.
      - sdk: CoreWLAN.framework
      - sdk: CoreLocation.framework
    settings:
      base:
        PRODUCT_NAME: $(RESTOREY_AGENT_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(RESTOREY_AGENT_LABEL)
        INFOPLIST_FILE: Agent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Agent/Agent.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  Restorey:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: RestoreyCore
      # The Shortcuts actions (Task 17e). Linked explicitly: Xcode's App Intents metadata step ("Extract App Intents
      # Metadata") skips a target with no AppIntents.framework dependency, and Shortcuts then never sees the actions.
      - sdk: AppIntents.framework
      # Built first, but embedded by the "Embed agent" script below rather than by an Embed
      # Files phase: Xcode resolves that phase's product name once (from Debug), so a
      # configuration-specific PRODUCT_NAME (RestoreyDevAgent vs RestoreyAgent) breaks Release.
      - target: RestoreyAgent
        embed: false
        link: false
    settings:
      base:
        PRODUCT_NAME: $(RESTOREY_APP_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(RESTOREY_ROOT_ID)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        # actool compiles the layered icon into Assets.car (macOS 26+) and AppIcon.icns, and adds CFBundleIconName and
        # CFBundleIconFile to the built Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # The Developer window is Debug-only: a Release build doesn't compile its files at all (its uses are
        # also behind #if DEBUG). ci.sh checks the built Release app has none of its types (verify-bundle.sh).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: $(SRCROOT)/App/Developer/*
    postBuildScripts:
      - name: Embed agent
        script: |
          set -euo pipefail
          SRC="${BUILT_PRODUCTS_DIR}/${RESTOREY_AGENT_PRODUCT_NAME}.app"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/${RESTOREY_AGENT_PRODUCT_NAME}.app"
          mkdir -p "$(dirname "$DEST")"
          rm -rf "${DEST:?}"
          # The agent target already signed itself (entitlements and profile); ditto keeps that.
          ditto "$SRC" "$DEST"
        basedOnDependencyAnalysis: false
      - name: Generate agent launchd plist
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/generate-agent-plist.sh"
        basedOnDependencyAnalysis: false
      - name: Embed and sign restic
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/restic"
          mkdir -p "$(dirname "$DEST")"
          cp "${SRCROOT}/vendor/restic" "$DEST"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]]; then
            codesign --force --options runtime --timestamp=none \
              --identifier "${RESTOREY_RESTIC_IDENTIFIER}" \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DEST"
          fi
        basedOnDependencyAnalysis: false
      # Last on purpose. Xcode builds into the same product folder every time and never re-dates it, so the bundle
      # kept its first build's modification date (10 Nov) through every later build, and ditto/zip copies keep it
      # too. The Dock (and Finder) check a cached icon against that date, so they kept showing the icon-less
      # placeholder after the icon landed. Re-dating the bundle makes every build look changed to them.
      # A folder's date isn't part of its code signature, so this doesn't disturb signing.
      - name: Re-date bundle
        script: |
          set -euo pipefail
          touch "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
        basedOnDependencyAnalysis: false
  # Hosted by the agent so the tests run with its keychain-access-groups entitlement and signature.
  # Bare `swift test` cannot do that (-34018 errSecMissingEntitlement; README, spec §10).
  AgentHostedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentHostedTests
    dependencies:
      - target: RestoreyAgent
        link: false
      - package: RestoreyCore
      - package: RestoreyCore
        product: AgentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RESTOREY_ROOT_ID).hostedtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(RESTOREY_AGENT_PRODUCT_NAME).app/Contents/MacOS/$(RESTOREY_AGENT_PRODUCT_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  AgentHostedTests:
    build:
      targets:
        RestoreyAgent: all
        AgentHostedTests: [test]
    test:
      config: Debug
      targets:
        - AgentHostedTests
