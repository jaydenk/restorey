name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run the CI checks
        run: scripts/ci.sh
