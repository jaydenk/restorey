# Throwaway platform spike. See ../docs/superpowers/plans/2026-11-10-platform-spike.md
name: RestoreySpike
options:
  bundleIdPrefix: com.jaydenkerr
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.4"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "0.0.1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RestoreySpikeAgent:
    type: application
    platform: macOS
    sources:
      - Agent
      - Shared
      - path: vendor/SpikeIcon.icns
        buildPhase: resources
    info:
      path: build/generated/Agent-Info.plist
      properties:
        CFBundleDisplayName: Restorey Spike
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: SpikeIcon
        LSUIElement: true
        SpikeKeychainAccessGroup: $(AppIdentifierPrefix)com.jaydenkerr.restorey.spike
        SpikeTeamID: $(DEVELOPMENT_TEAM)
    entitlements:
      path: build/generated/Agent.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaydenkerr.restorey.spike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaydenkerr.restorey.spike.agent
        PRODUCT_NAME: RestoreySpikeAgent
        SKIP_INSTALL: YES
  RestoreySpike:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: vendor/SpikeIcon.icns
        buildPhase: resources
      - path: LaunchAgents/com.jaydenkerr.restorey.spike.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: RestoreySpikeAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: build/generated/App-Info.plist
      properties:
        CFBundleDisplayName: Restorey Spike
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: SpikeIcon
        LSApplicationCategoryType: public.app-category.utilities
        SpikeKeychainAccessGroup: $(AppIdentifierPrefix)com.jaydenkerr.restorey.spike
    entitlements:
      path: build/generated/App.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaydenkerr.restorey.spike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaydenkerr.restorey.spike
        PRODUCT_NAME: RestoreySpike
    postBuildScripts:
      - name: Embed and sign restic
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/restic"
          mkdir -p "$(dirname "$DEST")"
          cp "${SRCROOT}/vendor/restic" "$DEST"
          codesign --force --options runtime --timestamp=none --identifier com.jaydenkerr.restorey.spike.restic --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DEST"
        basedOnDependencyAnalysis: false
